<aside>
  <div class="brand">
    <img src="/assets/logo-D9mZYfi1.png" alt="SoundFlow">
    <span>SoundFlow</span>
  </div>
  <div class="who">
    <span class="badge">Artist</span>
    <p>{{ guest().fullName }}</p>
  </div>
  <nav>
    @for (item of items; track item.to) {
      <a [routerLink]="item.to" routerLinkActive="active">
        <app-icon [name]="item.icon" />
        {{ item.label }}
      </a>
    }
  </nav>
  <div class="foot">
    <a routerLink="/settings" routerLinkActive="active">
      <app-icon name="settings" />
      Settings
    </a>
    <button type="button" (click)="logout()">
      <app-icon name="logout" />
      Log out
    </button>
  </div>
</aside>
